# Pages CMS configuration
# This file tells the editor at https://app.pagescms.org what you can edit.
# You don't need to touch this file to update your website.

media:
  input: public/images
  output: /images

content:
  - name: writing
    label: Writing
    type: collection
    path: src/content/blog
    filename: "{primary}.md"
    exclude: ["_TEMPLATE.md"]
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Summary
        description: One or two sentences. Shows up in post lists and link previews.
        type: text
        required: true
      - name: draft
        label: Draft (hide from site)
        type: boolean
        default: false
      - name: body
        label: Essay
        type: rich-text

  - name: links
    label: Links
    type: collection
    path: src/content/links
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    view:
      fields: [title, category, date]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: url
        label: Link (must start with https://)
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Articles, Podcasts, Research, Videos]
      - name: description
        label: Why it's worth it
        type: text
        required: true
      - name: date
        label: Date added
        type: date
        required: true

  - name: home
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: greeting
        label: Big heading
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: interests
        label: Intro paragraph
        type: text
      - name: recentTitle
        label: Recent writing heading
        type: string
      - name: recentCount
        label: Number of recent posts to show
        type: number

  - name: bio
    label: Bio page
    type: file
    path: src/data/bio.json
    format: json
    fields:
      - name: title
        label: Page title
        type: string
      - name: intro
        label: Intro paragraph (optional)
        type: text
      - name: careerTitle
        label: Career heading
        type: string
      - name: career
        label: Career timeline
        type: object
        list: true
        fields:
          - name: years
            label: Years
            type: string
          - name: role
            label: Role
            type: text
      - name: orgsTitle
        label: Organisations heading
        type: string
      - name: organisations
        label: Organisations
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: Website (optional)
            type: string

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
      - name: siteDescription
        label: Site description (for Google and link previews)
        type: text
      - name: writingIntro
        label: Writing page intro
        type: string
      - name: linksIntro
        label: Links page intro
        type: string
      - name: footerNote
        label: Footer note
        type: string
      - name: socialLinks
        label: Footer social links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
