[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Typing apoorvshah.com/admin takes you to the editor
[[redirects]]
  from = "/admin"
  to = "https://app.pagescms.org"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://app.pagescms.org"
  status = 302
  force = true
